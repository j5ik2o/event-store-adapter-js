# event-store-adapter グループ共通の、小さな変更向けの軽いワークフロー。
#
# 各リポジトリの .takt/workflows/light-change.yaml は、このファイルをそのまま写して置く
# (docs/operations/repository-policy.md の 8 章)。変えるときは、まずこのファイルを変え、各リポジトリへ同じ内容を配る。
# takt の組み込みの mini-core (plan → implement → 並列レビュー → 修正) を呼ぶ。手本は組み込みの backend-mini。
# 段ごとのモデルは .takt/runtime.yaml の mini-core/* の割り当てで決まる
# (計画とレビューは GPT-6.1-Sol、実装と修正は Sonnet 5.5)。
name: light-change
description: 文書・CI の設定・依存の更新・データの配布などの小さな変更向けの軽いワークフロー（plan → implement → 並列レビュー → 修正 → 完了）。flash-default の試験の先行作成と、複数観点のレビューと裁定を省く。
max_steps: 21
initial_step: develop
steps:
  - name: develop
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - implementation-semantics
      development_policy:
        - coding-lite
        - testing-lite
      development_knowledge:
        - implementation-semantics
      supervisor_persona: supervisor
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
