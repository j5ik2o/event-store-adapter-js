name: ddd-implement
description: "DDD ワークフロー用の builtin development-implement-dynamic のコピー。DDD 規約と衝突する builtin knowledge（backend）が注入されないよう動的 facet プールを外し、DDD の facet は固定の引数で受け取る。"
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    reimplementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-reimplement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
# builtin の親ワークフローからこの project workflow へ渡される facet 引数は、TAKT の信頼境界により、
# この section map に名前で宣言されていなければ拒否される。バンドル固有の facet は実ファイルを、
# builtin の facet は `{extends:<builtin名>}` だけの参照ファイルを指す。
policies:
  coding: ../facets/policies/builtin-coding.md
  testing: ../facets/policies/builtin-testing.md
  ai-antipattern: ../facets/policies/builtin-ai-antipattern.md
  ddd-domain-model: ../facets/policies/ddd-domain-model.md
  ddd-domain-layer: ../facets/policies/ddd-domain-layer.md
  ddd-use-case-layer: ../facets/policies/ddd-use-case-layer.md
  ddd-interface-adapter-layer: ../facets/policies/ddd-interface-adapter-layer.md
  ddd-layer-dependency: ../facets/policies/ddd-layer-dependency.md
  ddd-domain-packaging: ../facets/policies/ddd-domain-packaging.md
  ddd-module-layout: ../facets/policies/ddd-module-layout.md
  ddd-rust: ../facets/policies/ddd-rust.md
  ddd-typescript: ../facets/policies/ddd-typescript.md
knowledge:
  architecture: ../facets/knowledge/builtin-architecture.md
  implementation-semantics: ../facets/knowledge/builtin-implementation-semantics.md
  ddd-modeling: ../facets/knowledge/ddd-modeling.md
  ddd-rust: ../facets/knowledge/ddd-rust.md
  ddd-typescript: ../facets/knowledge/ddd-typescript.md
instructions:
  ddd-implement: ../facets/instructions/ddd-implement.md
  ddd-reimplement: ../facets/instructions/ddd-reimplement.md
report_formats:
  coder-scope: ../facets/output-contracts/builtin-coder-scope.md
# 動的 facet プールは使わない。親が implementation_pool を渡すため宣言だけ残している。
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    instruction:
      - $param: implementation_instruction
      - development-implementation-completion
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    quality_gates:
      - "`bun .takt/tools/ddd-lint/ddd-lint.ts --project .` の実行で指摘がない。ddd-lint のゲートが失敗したら、示された出力ログを読み、すべての指摘を直す。`.takt/tools/` の ddd-lint のソースは読まない"
      - type: command
        name: ddd-lint
        command: "bun .takt/tools/ddd-lint/ddd-lint.ts --project ."
        cwd: "."
        timeout_ms: 300000
    rules:
      - condition: 今回必要な実装を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない。レポートの未完了ラベルだけでは差し戻さない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、必須検証も完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 採用済み計画は有効だが、実装・原因調査・必須検証に不足が残り、現在の計画の範囲で具体的な補完作業を実行できる（未実行・失敗・未確認という報告だけでは計画変更としない）
        next: reimplement
        command_gates: skip
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
        command_gates: skip
      - condition: 現行計画または補完作業で実行できる必須作業がなく、必要な外部操作・外部回答が残るか、条件が両立しないと考える根拠が確認されている。外部制約と未完了義務を報告し、続行・計画変更・停止の最終判断を計画側へ渡す（ユーザー入力を求める選択肢が利用でき、かつその回答で作業を進められる場合だけ入力ルートを選ぶ）
        return: need_replan
        command_gates: skip
      - condition: ユーザー入力が必要
        next: implement
        command_gates: skip
        requires_user_input: true
        interactive_only: true
  - name: reimplement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    instruction:
      - $param: reimplementation_instruction
      - development-implementation-completion
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    quality_gates:
      - "`bun .takt/tools/ddd-lint/ddd-lint.ts --project .` の実行で指摘がない。ddd-lint のゲートが失敗したら、示された出力ログを読み、すべての指摘を直す。`.takt/tools/` の ddd-lint のソースは読まない"
      - type: command
        name: ddd-lint
        command: "bun .takt/tools/ddd-lint/ddd-lint.ts --project ."
        cwd: "."
        timeout_ms: 300000
    rules:
      - condition: 補完すべき実装・原因調査を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、未実行だった必須検証を完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 補完後も実装・原因調査・必須検証に不足が残る（採用済み計画が有効な場合を含む。利用可能なユーザー入力で解消できる場合を除く）。残る不足と根拠を報告し、続行の判断を計画側へ渡す
        return: need_replan
        command_gates: skip
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
        command_gates: skip
      - condition: 現行計画または補完作業で実行できる必須作業がなく、必要な外部操作・外部回答が残るか、条件が両立しないと考える根拠が確認されている。外部制約と未完了義務を報告し、続行・計画変更・停止の最終判断を計画側へ渡す（ユーザー入力を求める選択肢が利用でき、かつその回答で作業を進められる場合だけ入力ルートを選ぶ）
        return: need_replan
        command_gates: skip
      - condition: ユーザー入力が必要
        next: reimplement
        command_gates: skip
        requires_user_input: true
        interactive_only: true
