name: flash-implement-dynamic
description: "builtin development-implement-dynamic のコピー。tier 昇格を implement（T0）→ reimplement（T1）→ reimplement_final（T2）の step 列として展開し、T0 step の文脈予算のため dynamic_facets を無効化した実装実行。"
subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    implementation_pool:
      type: facet_pool_ref
      default: coding-facets
    implementation_companions:
      type: companion_ref[]
      default: []
    development_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - ai-antipattern
    development_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    implementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-implement-with-reports
    reimplementation_instruction:
      type: facet_ref
      facet_kind: instruction
      default: development-reimplement-with-reports
    scope_report_format:
      type: facet_ref
      facet_kind: report_format
      default: coder-scope
# builtin の development-core（project 外）からこの project workflow へ渡される facet 引数は、
# TAKT の信頼境界により「子ローカル（この section map に宣言された名前）」でなければ拒否される。
# bundle 固有の facet は実ファイルを、builtin の facet は `{extends:<builtin名>}` だけの参照ファイルを指す。
policies:
  coding-lite: ../facets/policies/coding-lite.md
  testing-lite: ../facets/policies/testing-lite.md
knowledge:
  implementation-semantics: ../facets/knowledge/builtin-implementation-semantics.md
instructions:
  implement-flash: ../facets/instructions/implement-flash.md
report_formats:
  coder-scope: ../facets/output-contracts/builtin-coder-scope.md
# implement / reimplement の dynamic_facets は無効化済みのため pool は参照されないが、
# development-core が渡す implementation_pool（facet_pool_ref）の検証には宣言が必要。
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: implement
# tier 昇格は promotion ではなく step 列で表現する。
# 子 workflow の stepIterations は workflow_call のたびに空から始まり、implement / reimplement の
# 自己ループは interactive_only のユーザー入力 rule だけなので、`promotion: {at: N}` は非対話実行では
# 発火しない（replan 経由の再入も毎回 1 回目扱いになる）。そのため tier ごとに別名 step を置き、
# runtime.yaml で step ごとに profile を直接割り当てる。replan 後の再入は T0 からやり直すが、
# 能力不足の失敗は必ず T1 → T2 を経てから need_replan で計画側へ戻る。
steps:
  - name: implement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/implement → profile <t0-production-code>
    instruction:
      - $param: implementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: implementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: 今回必要な実装を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない。レポートの未完了ラベルだけでは差し戻さない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、必須検証も完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 採用済み計画は有効だが、実装・原因調査・必須検証に不足が残り、現在の計画の範囲で具体的な補完作業を実行できる（未実行・失敗・未確認という報告だけでは計画変更としない）
        next: reimplement
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
      - condition: 現行計画または補完作業で実行できる必須作業がなく、必要な外部操作・外部回答が残るか、条件が両立しないと考える根拠が確認されている。外部制約と未完了義務を報告し、続行・計画変更・停止の最終判断を計画側へ渡す（ユーザー入力を求める選択肢が利用でき、かつその回答で作業を進められる場合だけ入力ルートを選ぶ）
        return: need_replan
      - condition: ユーザー入力が必要
        next: implement
        requires_user_input: true
        interactive_only: true
  - name: reimplement
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/reimplement → profile <t1>
    instruction:
      - $param: reimplementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: 補完すべき実装・原因調査を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、未実行だった必須検証を完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 補完後も実装・原因調査・必須検証に不足が残る（採用済み計画が有効な場合を含む。利用可能なユーザー入力で解消できる場合を除く）。残る不足と根拠を報告し、次の補完ステップへ引き継ぐ
        next: reimplement_final
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
      - condition: 現行計画または補完作業で実行できる必須作業がなく、必要な外部操作・外部回答が残るか、条件が両立しないと考える根拠が確認されている。外部制約と未完了義務を報告し、続行・計画変更・停止の最終判断を計画側へ渡す（ユーザー入力を求める選択肢が利用でき、かつその回答で作業を進められる場合だけ入力ルートを選ぶ）
        return: need_replan
      - condition: ユーザー入力が必要
        next: reimplement
        requires_user_input: true
        interactive_only: true
  - name: reimplement_final
    capabilities:
      - edit
      - enable-skills
    uses: development-core-implement
    # runtime.yaml: flash-implement-dynamic/reimplement_final → profile <t2>
    instruction:
      - $param: reimplementation_instruction
    with:
      development_policy:
        $param: development_policy
      development_knowledge:
        $param: development_knowledge
      implementation_instruction:
        $param: reimplementation_instruction
      scope_report_format:
        $param: scope_report_format
    companion:
      $param: implementation_companions
    rules:
      - condition: 補完すべき実装・原因調査を行い、必須検証も完了した（変更と因果関係がなく、今回の必須条件でもない既存失敗・対象外作業は完了を妨げない）
        next: COMPLETE
      - condition: 今回必要な実装変更がなく、未実行だった必須検証を完了した（レポート作成のみ。未着手の必須作業がある場合は除く）
        next: COMPLETE
      - condition: 補完後も実装・原因調査・必須検証に不足が残る（採用済み計画が有効な場合を含む。利用可能なユーザー入力で解消できる場合を除く）。残る不足と根拠を報告し、続行の判断を計画側へ渡す
        return: need_replan
      - condition: 採用済み計画の前提・範囲・方法または検証能力に欠陥があり、計画を変更すれば具体的なプロジェクト内の作業を実行でき、変更しなければ要求を実行・検証できない（未実行・失敗・原因未確定・証拠不足だけでは該当しない。外部操作だけで進める状態は除く）
        return: need_replan
      - condition: 現行計画または補完作業で実行できる必須作業がなく、必要な外部操作・外部回答が残るか、条件が両立しないと考える根拠が確認されている。外部制約と未完了義務を報告し、続行・計画変更・停止の最終判断を計画側へ渡す（ユーザー入力を求める選択肢が利用でき、かつその回答で作業を進められる場合だけ入力ルートを選ぶ）
        return: need_replan
      - condition: ユーザー入力が必要
        next: reimplement_final
        requires_user_input: true
        interactive_only: true
