name: ddd-rust-default
description: "DDD 規約に従う Rust コードを書くための、builtin default と同じ開発ワークフロー。計画担当がドメインモデルの変更を宣言し、実装担当がそれをコードより先に反映し、DDD レビュアーがモデル・層の規則・Rust の規則に照らしてコードを確認する。DDD 規約と衝突する builtin facet（backend、CQRS+ES）は使わない。"
max_steps: 51
initial_step: develop

# 引数は builtin default と同じで、DDD の facet を加えている:
#   計画担当     : ddd-plan / ddd-replan が .ddd.toml と docs/ddd/*.yaml への変更を宣言する
#   実装担当     : ddd-implement / ddd-reimplement がそれをコードより先に反映する
#   レビュアー   : ddd-review が backend と CQRS+ES のレビュアーを DDD レビュアーに置き換える
# builtin の architecture knowledge は残す。DDD を優先する箇所は ddd-domain-packaging policy に書いてある。

steps:
  - name: develop
    kind: workflow_call
    call: development-core
    args:
      implementation_pool: coding-facets
      implementation_workflow: ddd-implement
      remediation_workflow: ddd-remediation
      reviewer_suite: ddd-review
      plan_instruction: ddd-plan
      plan_report_format: scenario-based-plan
      replan_instruction: ddd-replan
      plan_policy:
        - design-planning
        - ddd-domain-model
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
      plan_knowledge:
        - architecture
        - task-decomposition
        - ddd-modeling
        - ddd-rust
      testing_instruction: scenario-based-write-tests-first
      testing_report_format: scenario-based-test-report
      testing_policy:
        - coding
        - testing
        - ddd-domain-layer
        - ddd-rust
      testing_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ddd-modeling
        - ddd-rust
      development_policy:
        - coding
        - testing
        - ai-antipattern
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      development_knowledge:
        - architecture
        - implementation-semantics
        - ddd-modeling
        - ddd-rust
      implementation_instruction: ddd-implement
      reimplementation_instruction: ddd-reimplement
      fix_plan_instruction: scenario-based-fix-plan-from-review-resolution
      fix_replan_instruction: scenario-based-fix-replan
      fix_plan_report_format: scenario-based-fix-plan
      final_gate_instruction: scenario-based-supervise-review-resolution
      implementation_companions:
        fixed:
          - ai-antipattern-review-companion
          - testing-review-companion
        pool: []
        moderator: review-companion-moderator
      review_policy_additions:
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      review_policy:
        - coding
        - testing
        - review
        - architecture
        - ddd-domain-model
        - ddd-domain-layer
        - ddd-use-case-layer
        - ddd-interface-adapter-layer
        - ddd-layer-dependency
        - ddd-domain-packaging
        - ddd-module-layout
        - ddd-rust
      review_knowledge:
        - architecture
        - unit-testing
        - e2e-testing
        - ddd-modeling
        - ddd-rust
    rules:
      - condition: COMPLETE
        next: COMPLETE
      - condition: ABORT
        next: ABORT
