name: ddd-remediation
description: "DDD ワークフロー用の builtin development-remediation-dynamic のコピー。ddd-implement と同じ理由で fix と fix-retry の動的 facet プールを外している。"
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction

subworkflow:
  callable: true
  visibility: internal
  returns:
    - need_replan
  params:
    fix_pool:
      type: facet_pool_ref
      default: coding-facets
    fix_companions:
      type: companion_ref[]
      default: []
    plan_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
    verification_policy:
      type: facet_ref[]
      facet_kind: policy
      default:
        - coding
        - testing
        - review
    fix_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - implementation-semantics
    verification_knowledge:
      type: facet_ref[]
      facet_kind: knowledge
      default:
        - architecture
        - unit-testing
        - e2e-testing
    fix_plan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: fix-plan-from-review-resolution
    fix_replan_instruction:
      type: facet_ref
      facet_kind: instruction
      default: fix-replan
    fix_plan_report_format:
      type: facet_ref
      facet_kind: report_format
      default: fix-plan
# builtin の親ワークフローからこの project workflow へ渡される facet 引数は、TAKT の信頼境界により、
# この section map に名前で宣言されていなければ拒否される。バンドル固有の facet は実ファイルを、
# builtin の facet は `{extends:<builtin名>}` だけの参照ファイルを指す。
policies:
  coding: ../facets/policies/builtin-coding.md
  testing: ../facets/policies/builtin-testing.md
  ai-antipattern: ../facets/policies/builtin-ai-antipattern.md
  review: ../facets/policies/builtin-review.md
  architecture: ../facets/policies/builtin-architecture.md
  ddd-domain-model: ../facets/policies/ddd-domain-model.md
  ddd-domain-layer: ../facets/policies/ddd-domain-layer.md
  ddd-use-case-layer: ../facets/policies/ddd-use-case-layer.md
  ddd-interface-adapter-layer: ../facets/policies/ddd-interface-adapter-layer.md
  ddd-layer-dependency: ../facets/policies/ddd-layer-dependency.md
  ddd-domain-packaging: ../facets/policies/ddd-domain-packaging.md
  ddd-module-layout: ../facets/policies/ddd-module-layout.md
  ddd-rust: ../facets/policies/ddd-rust.md
  ddd-typescript: ../facets/policies/ddd-typescript.md
knowledge:
  architecture: ../facets/knowledge/builtin-architecture.md
  implementation-semantics: ../facets/knowledge/builtin-implementation-semantics.md
  unit-testing: ../facets/knowledge/builtin-unit-testing.md
  e2e-testing: ../facets/knowledge/builtin-e2e-testing.md
  ddd-modeling: ../facets/knowledge/ddd-modeling.md
  ddd-rust: ../facets/knowledge/ddd-rust.md
  ddd-typescript: ../facets/knowledge/ddd-typescript.md
instructions:
  scenario-based-fix-plan-from-review-resolution: ../facets/instructions/builtin-scenario-based-fix-plan-from-review-resolution.md
  scenario-based-fix-replan: ../facets/instructions/builtin-scenario-based-fix-replan.md
report_formats:
  scenario-based-fix-plan: ../facets/output-contracts/builtin-scenario-based-fix-plan.md
facet_pools:
  coding-facets:
    uses: coding-facets
  takt-coding-facets:
    uses: takt-coding-facets
initial_step: fix-plan
loop_monitors:
  - cycle:
      - fix-replan
      - fix
    ignore_steps:
      - fix-verifier
      - fix-retry
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: fix-replan
        - condition: 修正未完了または報告未収束だが、次のレビュー・修正が実行可能である
          next: fix-replan
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-replan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
  - cycle:
      - fix-retry
      - fix-verifier
    threshold: 4
    judge:
      persona: supervisor
      instruction: loop-monitor-reviewers-fix
      rules:
        - condition: 健全（修正進捗があり、報告内容も収束している）
          next: fix-retry
        - condition: 修正未完了または報告未収束だが、次の修正が実行可能である
          next: fix-retry
        - condition: 修正方針の前提を変える必要があり、再計画が実行可能である
          next: fix-replan
        - condition: 要件を満たす実現可能な打開手段がない
          next: ABORT
steps:
  - name: fix-plan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction:
        $param: fix_plan_instruction
      plan_report_format:
        $param: fix_plan_report_format
    rules:
      - condition: 修正計画を確定した、または原因未確定でも現行の要求・修正範囲内で具体的な調査と、その結果に応じた安全な修正・検証を最初の修正単位として実行できる（未実行・未確認だけではタスク全体の再計画にしない）
        next: fix
      - condition: 要求・修正範囲などタスク全体の前提を見直す必要があり、その変更で具体的なプロジェクト内の作業が実行可能になる（局所的な原因調査の未実行だけでは該当しない）
        return: need_replan
      - condition: 必要な作業をプロジェクト内で進める手段がなく、その根拠と必要な外部操作または両立不能な条件が確認されている
        next: ABORT
  - name: fix-replan
    uses: peer-review-fix-plan
    with:
      plan_policy:
        $param: plan_policy
      fix_knowledge:
        $param: fix_knowledge
      plan_instruction:
        $param: fix_replan_instruction
      plan_report_format:
        $param: fix_plan_report_format
    rules:
      - condition: 修正計画を確定した、または原因未確定でも現行の要求・修正範囲内で具体的な調査と、その結果に応じた安全な修正・検証を最初の修正単位として実行できる（未実行・未確認だけではタスク全体の再計画にしない）
        next: fix
      - condition: 要求・修正範囲などタスク全体の前提を見直す必要があり、その変更で具体的なプロジェクト内の作業が実行可能になる（局所的な原因調査の未実行だけでは該当しない）
        return: need_replan
      - condition: 必要な作業をプロジェクト内で進める手段がなく、その根拠と必要な外部操作または両立不能な条件が確認されている
        next: ABORT
  - name: fix
    capabilities:
      - edit
      - enable-skills
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-plan
    companion:
      $param: fix_companions
    quality_gates:
      - "`bun .takt/tools/ddd-lint/ddd-lint.ts --project .` の実行で指摘がない。ddd-lint のゲートが失敗したら、示された出力ログを読み、すべての指摘を直す。`.takt/tools/` の ddd-lint のソースは読まない"
      - type: command
        name: ddd-lint
        command: "bun .takt/tools/ddd-lint/ddd-lint.ts --project ."
        cwd: "."
        timeout_ms: 300000
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-replan
        command_gates: skip
      - condition: タスク全体の再計画が必要
        return: need_replan
        command_gates: skip
  - name: fix-verifier
    uses: peer-review-fix-verifier
    with:
      verification_policy:
        $param: verification_policy
      fix_knowledge:
        $param: verification_knowledge
    rules:
      - condition: verified
        next: COMPLETE
      - condition: plan_invalid — 修正計画に必要な要素・状態・経路の漏れ、対象外の混入、または前提・境界・方法・証拠能力の不備がある。実装不足または証拠不足も同時にある場合を含む
        next: fix-replan
      - condition: incomplete — 修正計画に不備はないが、計画済みの義務に実装不足または証拠不足がある
        next: fix-retry
  - name: fix-retry
    capabilities:
      - edit
      - enable-skills
    uses: peer-review-fix
    with:
      fix_policy:
        $param: fix_policy
      fix_knowledge:
        $param: fix_knowledge
      fix_instruction: apply-fix-verification
    companion:
      $param: fix_companions
    quality_gates:
      - "`bun .takt/tools/ddd-lint/ddd-lint.ts --project .` の実行で指摘がない。ddd-lint のゲートが失敗したら、示された出力ログを読み、すべての指摘を直す。`.takt/tools/` の ddd-lint のソースは読まない"
      - type: command
        name: ddd-lint
        command: "bun .takt/tools/ddd-lint/ddd-lint.ts --project ."
        cwd: "."
        timeout_ms: 300000
    rules:
      - condition: 修正完了
        next: fix-verifier
      - condition: 修正計画の見直しが必要
        next: fix-replan
        command_gates: skip
      - condition: タスク全体の再計画が必要
        return: need_replan
        command_gates: skip
