# event-store-adapter グループ共通の TAKT のプロジェクト設定。
# 各リポジトリの .takt/config.yaml は、このファイルをそのまま写して置く(docs/operations/repository-policy.md の 8 章)。
# 上流のテンプレート: https://github.com/ideo-plus/takt-workflows/blob/main/config.project.yaml
language: ja
auto_pr: false
concurrency: 1
# 利用上限に当たったステップは、失敗させずに次の provider / model で実行し直す
# takt は、今と異なり、まだ試していない先頭の候補を選ぶ。下に書いた順に切り替える
# Claude と OpenCode Go の後ろに Ollama Cloud の 3 モデルを置く(2026-10-07 にオーナーが指定)
# Claude の 2 候補の後ろに Codex の GPT-6.1-Sol を置く(2026-10-07 にオーナーが指定)
rate_limit_fallback:
  switch_chain:
    - { provider: claude,   model: claude-sonnet-5-5 }
    - { provider: claude,   model: claude-opus-5-5 }
    - { provider: codex,    model: gpt-6.1-sol }
    - { provider: opencode, model: opencode-go/deepseek-v4.1-flash }
    - { provider: opencode, model: ollama/deepseek-v4.1-flash:cloud }
    - { provider: opencode, model: ollama/glm-5.3:cloud }
    - { provider: opencode, model: ollama/glm-5.3-flash:cloud }
