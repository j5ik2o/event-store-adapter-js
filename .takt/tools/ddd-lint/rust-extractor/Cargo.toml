[package]
name = "ddd-rust-syn-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
quote = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
syn = { version = "=3.0.5", default-features = false, features = ["full", "parsing", "printing", "visit"] }

[profile.release]
strip = true
