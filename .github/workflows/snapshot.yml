name: Snapshot
on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: ${{ github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push","schedule"]'), github.event.workflow_run.event) && github.event.workflow_run.head_sha == github.sha }}
    name: "Publish Snapshot"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Set Snapshot version
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const packageJsonPath = "packages/library/package.json";
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, "utf8"));
          const baseVersion = packageJson.version.replace(/-snapshot\.\d+$/, "");
          const version = `${baseVersion}-snapshot.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
          fs.writeFileSync(packageJsonPath, `${JSON.stringify({ ...packageJson, version }, null, 2)}\n`);
          console.log(version);
          NODE
      - run: pnpm run build
      - run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$current_main_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping Snapshot publish because main has advanced."
            exit 0
          fi
          pnpm --filter event-store-adapter-js publish --access public --no-git-checks --tag snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
