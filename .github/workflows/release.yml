name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '公開する既存のタグ（例: v3.1.1）'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
concurrency:
  group: release-publish
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LC_ALL: C
        run: |
          numeric='(0|[1-9][0-9]*)'
          semver="^v${numeric}\\.${numeric}\\.${numeric}$"
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo '::error::tag must be vMAJOR.MINOR.PATCH without prerelease or build metadata (e.g. v3.1.1)'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Disable automatic provenance for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: echo 'PNPM_CONFIG_PROVENANCE=false' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Verify tag matches package version
        id: package_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          expected="${RELEASE_TAG#v}"
          actual=$(node -p "require('./packages/library/package.json').version")
          if [[ "$expected" != "$actual" ]]; then
            echo "::error::tag version ${expected} does not match packages/library/package.json version ${actual}"
            exit 1
          fi
          echo "version=${actual}" >> "$GITHUB_OUTPUT"
      - name: Check the tagged commit against the release gate
        id: release_gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          GATE="${RUNNER_TEMP}/release-gate"
          RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          bash "${GITHUB_WORKSPACE}"/.github/release-gate-inputs.sh "$RELEASE_SHA" "$GATE"
          python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py check --mode publish --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --on-main "$(cat "${GATE}/on-main")" \
            --parent-package "${GATE}/parent.json" --package "${GATE}/package.json" \
            --changed-files "${GATE}/changed-files" --pulls "${GATE}/pulls.json" \
            --remote-tags "${GATE}/remote-tags"
      - name: Check that the version is not on npm yet
        id: npm_before
        env:
          RELEASE_VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          if PUBLISHED=$(npm view "event-store-adapter-js@${RELEASE_VERSION}" version 2> "${RUNNER_TEMP}/npm-view.err"); then
            if [[ -n "$PUBLISHED" ]]; then
              echo "::error::event-store-adapter-js@${RELEASE_VERSION} is already on npm; see CONTRIBUTING (When a release stops halfway)"
              exit 1
            fi
          elif ! grep -q E404 "${RUNNER_TEMP}/npm-view.err"; then
            cat "${RUNNER_TEMP}/npm-view.err"
            exit 1
          fi
          LATEST=$(npm view event-store-adapter-js dist-tags.latest)
          if [[ -n "$LATEST" ]] && ! python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py greater "$RELEASE_VERSION" "$LATEST"; then
            echo "::error::${RELEASE_VERSION} must be greater than the npm latest ${LATEST}"
            exit 1
          fi
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check that no newer tag appeared during the build
        id: final_tag_check
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          LATEST_TAG=$(git ls-remote --tags origin | awk -F '\t' '{ print $2 }' \
            | sed -e 's#^refs/tags/##' -e '/\^{}$/d' \
            | python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py latest-tag)
          if [[ "$LATEST_TAG" != "$RELEASE_TAG" ]]; then
            echo "::error::the latest release tag is ${LATEST_TAG}, not ${RELEASE_TAG}; a newer release must not be overtaken"
            exit 1
          fi
      - run: pnpm --filter event-store-adapter-js publish --access public --no-git-checks
  # 公開のあとの確認は、公開と別のジョブにする。時間切れなら「失敗したジョブを再実行」で、このジョブと github-release だけが
  # やり直され、公開はやり直されない（#1161）。npm を読むだけなので、id-token と秘密を持たせない
  confirm:
    name: Check that npm serves the published version
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      # 待ちの上限は、利用者が読む CDN の側の遅れ（v5.3.0 の実測の元のサーバーの約190秒と、キャッシュの最大300秒）を覆う
      - name: Check that npm serves the published version
        id: confirm
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          EXPECT_PROVENANCE: ${{ github.event_name == 'push' }}
          CONFIRM_DEADLINE_SECONDS: 900
          CONFIRM_INTERVAL_SECONDS: 20
        run: |
          PROVENANCE=()
          if [[ "$EXPECT_PROVENANCE" == "true" ]]; then
            PROVENANCE=(--provenance)
          fi
          python3 "${GITHUB_WORKSPACE}"/.github/npm-registry.py confirm --version "${RELEASE_TAG#v}" "${PROVENANCE[@]}" \
            --interval "$CONFIRM_INTERVAL_SECONDS" --deadline "$CONFIRM_DEADLINE_SECONDS"
  github-release:
    name: Create the GitHub release
    needs: confirm
    if: always() && needs.confirm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Create the release from the tag
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists"
            exit 0
          fi
          PREV_TAG=$(git tag -l 'v*' | python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py latest-tag --below "${RELEASE_TAG#v}")
          if [[ -z "$PREV_TAG" ]]; then
            # 前の正式版のタグがない最初の公開は、履歴の最初のコミットから数える
            PREV_TAG=$(git rev-list --max-parents=0 "$RELEASE_TAG" | tail -n 1)
          fi
          python3 "${GITHUB_WORKSPACE}"/.github/create-release-note-header.py \
            "$SERVER_URL" "$GITHUB_REPOSITORY" "$PREV_TAG" "$RELEASE_TAG" > "${RUNNER_TEMP}/changelog.txt"
          git log "${PREV_TAG}..${RELEASE_TAG}" --no-merges --format='%H%x1f%s%x1f%b%x1e' \
            | python3 "${GITHUB_WORKSPACE}"/.github/create-release-note-body.py "$SERVER_URL" "$GITHUB_REPOSITORY" \
            >> "${RUNNER_TEMP}/changelog.txt"
          # Latest はここでは付けない。次の手順が、一覧を読み直して最大の版を Latest にする
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Release ${RELEASE_TAG}" --notes-file "${RUNNER_TEMP}/changelog.txt" --latest=false
      - name: Mark the greatest release as latest
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -o pipefail
          # 確認だけを再実行して古い版のリリースを作ったときも、最大の正式版（vX.Y.Z）のリリースを Latest にする。
          # 版の違う実行が同時にこの手順を動かず、一覧に最大の版が出ている限り、最大の版が Latest になる（何度動いても同じ結果）。
          # 作った直後のリリースが一覧にまだ出ないことがあるので、RELEASE_TAG を足して選ぶ
          RELEASED=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft | not) | .tag_name')
          LATEST_TAG=$(printf '%s\n%s\n' "$RELEASED" "$RELEASE_TAG" \
            | python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py latest-tag)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::no GitHub release of a version vX.Y.Z exists"
            exit 1
          fi
          echo "the greatest release is ${LATEST_TAG}; mark it latest"
          gh release edit "$LATEST_TAG" --repo "$GITHUB_REPOSITORY" --latest
