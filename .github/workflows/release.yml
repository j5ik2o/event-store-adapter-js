name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '公開する既存のタグ（例: v3.1.1）'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          LC_ALL: C
        run: |
          numeric='(0|[1-9][0-9]*)'
          semver="^v${numeric}\\.${numeric}\\.${numeric}$"
          if [[ ! "$RELEASE_TAG" =~ $semver ]]; then
            echo '::error::tag must be vMAJOR.MINOR.PATCH without prerelease or build metadata (e.g. v3.1.1)'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      - name: Disable automatic provenance for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: echo 'PNPM_CONFIG_PROVENANCE=false' >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --filter event-store-adapter-js publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
