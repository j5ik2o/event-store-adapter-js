name: Bump-Version
on:
  push:
    branches:
      - main
    paths:
      - packages/library/package.json
  workflow_dispatch:
    inputs:
      level:
        description: Version bump level
        type: choice
        required: true
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: Explicit next version (X.Y.Z). When set, level is ignored
        type: string
        required: false
        default: ''
jobs:
  bump-version:
    name: Open the version pull request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate requested version
        id: requested_version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          LC_ALL: C
        run: |
          if [[ -z "$REQUESTED_VERSION" ]]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          numeric='(0|[1-9][0-9]*)'
          semver="^${numeric}\\.${numeric}\\.${numeric}$"
          if [[ ! "$REQUESTED_VERSION" =~ $semver ]]; then
            echo "::error::version must be X.Y.Z without a v prefix, prerelease or build metadata"
            exit 1
          fi
          LATEST_VERSION=$(git tag -l 'v*' | sort -V | tail -n 1)
          LATEST_VERSION="${LATEST_VERSION#v}"
          if [[ -n "$LATEST_VERSION" ]]; then
            HIGHEST=$(printf '%s\n' "$LATEST_VERSION" "$REQUESTED_VERSION" | sort -V | tail -n 1)
            if [[ "$LATEST_VERSION" == "$REQUESTED_VERSION" || "$HIGHEST" != "$REQUESTED_VERSION" ]]; then
              echo "::error::version $REQUESTED_VERSION must be greater than the latest tag v$LATEST_VERSION"
              exit 1
            fi
          fi
          if git rev-parse -q --verify "refs/tags/v${REQUESTED_VERSION}" > /dev/null; then
            echo "::error::tag v${REQUESTED_VERSION} already exists"
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install semver
      - id: defines
        run: |
          LATEST_TAG=$(git tag -l 'v*' | python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py latest-tag)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "::error::no release tag vX.Y.Z exists"
            exit 1
          fi
          echo "LATEST_TAG=$LATEST_TAG"
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
      - name: Calculate changes from the latest tag to HEAD
        id: changes
        env:
          PREV_TAG: ${{ steps.defines.outputs.prev_tag }}
        run: |
          COUNT=$(git rev-list --count "${PREV_TAG}..HEAD" \
            --no-merges -P --grep='^(BREAKING CHANGE|build|ci|feat|fix|docs|style|refactor|perf|test|revert|chore)(\(.*\))?!?:|^BREAKING[ -]CHANGE:')
          echo "COUNT=$COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Calculate semver level
        id: semver_level
        env:
          REQUESTED_LEVEL: ${{ inputs.level }}
          PREV_TAG: ${{ steps.defines.outputs.prev_tag }}
        run: |
          if [[ "$REQUESTED_LEVEL" != "auto" ]]; then
            echo "semver_level=$REQUESTED_LEVEL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SEMVER_LEVEL=$(git log "${PREV_TAG}..HEAD" --pretty=format:"%s%x1f%b%x1e" \
            --no-merges -P --grep='^(BREAKING CHANGE|build|ci|feat|fix|docs|style|refactor|perf|test|revert|chore)(\(.*\))?!?:|^BREAKING[ -]CHANGE:' \
            | python3 "${GITHUB_WORKSPACE}"/.github/semver-level.py)
          echo "SEMVER_LEVEL=$SEMVER_LEVEL"
          echo "semver_level=$SEMVER_LEVEL" >> "$GITHUB_OUTPUT"
        if: inputs.version == '' && (steps.changes.outputs.count > 0 || inputs.level != 'auto')
      - name: Get the next version
        id: versions
        env:
          REQUESTED_VERSION: ${{ steps.requested_version.outputs.version }}
          PREV_TAG: ${{ steps.defines.outputs.prev_tag }}
          SEMVER_LEVEL: ${{ steps.semver_level.outputs.semver_level }}
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            NEXT_VERSION="$REQUESTED_VERSION"
          else
            NEXT_VERSION=$(echo "$PREV_TAG" | python3 "${GITHUB_WORKSPACE}"/.github/next-semver.py "$SEMVER_LEVEL")
          fi
          echo "NEXT_VERSION=$NEXT_VERSION"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
      - name: Check that the version branch is free
        id: version_branch
        env:
          NEXT_TAG: ${{ steps.versions.outputs.next_tag }}
        run: |
          BRANCH="release/${NEXT_TAG}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" > /dev/null; then
            echo "::error::branch ${BRANCH} already exists; merge or close its pull request and delete the branch first"
            exit 1
          fi
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
      - name: Write the pull request body
        id: pr_body
        env:
          PREV_TAG: ${{ steps.defines.outputs.prev_tag }}
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
          NEXT_TAG: ${{ steps.versions.outputs.next_tag }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          BODY="${RUNNER_TEMP}/version-pr-body.md"
          {
            echo "Bump \`packages/library/package.json\` to \`${NEXT_VERSION}\`. This pull request changes nothing else."
            echo
            echo "Merging it into \`main\` starts the release: the Bump-Version workflow tags the merged commit \`${NEXT_TAG}\`, the tag starts the Release workflow, which publishes \`${NEXT_VERSION}\` to npm (\`latest\`) and then creates the GitHub release."
            echo "Merge it only when the release should go out. To cancel, close this pull request and delete the branch."
            echo
            echo "## Release notes preview"
            echo
            echo "Changes since [\`${PREV_TAG}\`](${SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...release/${NEXT_TAG}). The GitHub release compares \`${PREV_TAG}...${NEXT_TAG}\` after the tag exists."
            echo
            git log "${PREV_TAG}..HEAD" --no-merges --format='%H%x1f%s%x1f%b%x1e' \
              | python3 "${GITHUB_WORKSPACE}"/.github/create-release-note-body.py "$SERVER_URL" "$GITHUB_REPOSITORY"
          } > "$BODY"
          echo "path=${BODY}" >> "$GITHUB_OUTPUT"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
      - name: Push the version branch
        id: version_commit
        env:
          NEXT_VERSION: ${{ steps.versions.outputs.next_version }}
          NEXT_TAG: ${{ steps.versions.outputs.next_tag }}
          BRANCH: ${{ steps.version_branch.outputs.branch }}
          PUSH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${AUTH}"
          git config --global user.email "j5ik2o@gmail.com"
          git config --global user.name "Junichi Kato"
          git switch -c "$BRANCH"
          node "${GITHUB_WORKSPACE}"/.github/set-package-version.js "$NEXT_VERSION"
          git add packages/library/package.json pnpm-lock.yaml
          git commit -m "version up to ${NEXT_TAG}"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git push origin "HEAD:refs/heads/${BRANCH}"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
      - name: Open the version pull request
        id: version_pr
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          NEXT_TAG: ${{ steps.versions.outputs.next_tag }}
          BRANCH: ${{ steps.version_branch.outputs.branch }}
          BODY: ${{ steps.pr_body.outputs.path }}
        run: |
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "version up to ${NEXT_TAG}" --body-file "$BODY")
          echo "$PR_URL"
          echo "number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
      - name: Publish the review-thread status of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.version_pr.outputs.number }}
        run: |
          gh workflow run review-thread-resolution.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"
        if: steps.changes.outputs.count > 0 || inputs.level != 'auto' || inputs.version != ''
  tag-release:
    name: Tag the merged version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'j5ik2o/event-store-adapter-js'
    runs-on: ubuntu-latest
    concurrency:
      group: release-tag
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the merged commit against the release gate
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          GATE="${RUNNER_TEMP}/release-gate"
          mkdir -p "$GATE"
          git fetch --no-tags origin main
          ON_MAIN=false
          if git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD; then
            ON_MAIN=true
          fi
          git show "${RELEASE_SHA}^:packages/library/package.json" > "${GATE}/parent.json"
          git show "${RELEASE_SHA}:packages/library/package.json" > "${GATE}/package.json"
          git diff --name-only "${RELEASE_SHA}^" "$RELEASE_SHA" > "${GATE}/changed-files"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" > "${GATE}/pulls.json"
          git ls-remote --tags origin > "${GATE}/remote-tags"
          TAG=$(python3 "${GITHUB_WORKSPACE}"/.github/release-gate.py check --mode tag \
            --repository "$GITHUB_REPOSITORY" --sha "$RELEASE_SHA" --on-main "$ON_MAIN" \
            --parent-package "${GATE}/parent.json" --package "${GATE}/package.json" \
            --changed-files "${GATE}/changed-files" --pulls "${GATE}/pulls.json" \
            --remote-tags "${GATE}/remote-tags")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Push the release tag
        id: release_tag
        env:
          RELEASE_TAG: ${{ steps.trigger.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
          PUSH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          AUTH=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::${AUTH}"
          git config --global user.email "j5ik2o@gmail.com"
          git config --global user.name "Junichi Kato"
          git tag -f -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader" \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH}" \
            git push origin "refs/tags/${RELEASE_TAG}"; then
            REMOTE_SHA=$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | cut -f1)
            if [[ "$REMOTE_SHA" != "$RELEASE_SHA" ]]; then
              echo "::error::tag ${RELEASE_TAG} could not be pushed (remote: ${REMOTE_SHA:-none})"
              exit 1
            fi
            echo "tag ${RELEASE_TAG} was pushed by another run on the same commit"
          fi
        if: steps.trigger.outputs.tag != ''
