# main の CI が失敗したら issue を作る（同じ失敗が続くときは、開いている issue にコメントを足す）。
# 6 言語のリポジトリの .github/workflows/main-ci-failure.yml に、同じ内容で写す正本。
# 写すときに替えるのは、下の `on.workflow_run.workflows` の 1 か所だけ。
# CI のワークフローの `name:` に合わせる（rs は "ci"、ほかの 5 つは "CI"）。
# このワークフローは `CI Success` の依存やブランチ保護に入れない（マージを止める仕組みではない）。
name: main-ci-failure

on:
  workflow_run:
    workflows: ["CI"] # ← 写すときに替える 1 か所（CI のワークフローの name）
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "確かめたい過去の CI の実行の ID"
        required: true
        type: string

permissions:
  issues: write
  actions: read

env:
  LABEL: ci-failure-on-main

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 元の実行を調べる
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in
            ''|*[!0-9]*) echo "::error::run_id は数字だけで指定する: $RUN_ID"; exit 1 ;;
          esac
          gh api "repos/$REPO/actions/runs/$RUN_ID" > run.json
          event=$(jq -r '.event' run.json)
          branch=$(jq -r '.head_branch' run.json)
          conclusion=$(jq -r '.conclusion // ""' run.json)
          {
            echo "event=$event"
            echo "branch=$branch"
            echo "conclusion=$conclusion"
            echo "url=$(jq -r '.html_url' run.json)"
            echo "sha=$(jq -r '.head_sha' run.json)"
            echo "run_number=$(jq -r '.run_number' run.json)"
            echo "run_attempt=$(jq -r '.run_attempt' run.json)"
          } >> "$GITHUB_OUTPUT"
          if [ "$branch" = "main" ] && { [ "$event" = "push" ] || [ "$event" = "schedule" ]; }; then
            echo "target=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=false" >> "$GITHUB_OUTPUT"
            echo "対象外の実行（branch=$branch, event=$event）なので何もしない"
          fi

      - name: 失敗を知らせる
        # 時間切れ（timed_out）と起動の失敗（startup_failure）も失敗として扱う
        if: steps.run.outputs.target == 'true' && contains(fromJSON('["failure", "timed_out", "startup_failure"]'), steps.run.outputs.conclusion)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          RUN_URL: ${{ steps.run.outputs.url }}
          SHA: ${{ steps.run.outputs.sha }}
          EVENT: ${{ steps.run.outputs.event }}
          RUN_NUMBER: ${{ steps.run.outputs.run_number }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then trigger="定期実行 (schedule)"; else trigger="push"; fi
          failed_jobs=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "  - " + .name')
          if [ -z "$failed_jobs" ]; then failed_jobs="  - （失敗したジョブを取得できなかった。実行の URL で確かめる）"; fi
          {
            echo "main の CI が失敗した。"
            echo
            echo "- 実行: $RUN_URL"
            echo "- コミット: $SHA"
            echo "- きっかけ: $trigger"
            echo "- 失敗したジョブ:"
            echo "$failed_jobs"
            echo
            # 実行番号と試行の回数（流し直しで増える）から作る順序の値
            echo "<!-- ci-run-key: $((RUN_NUMBER * 1000 + RUN_ATTEMPT)) -->"
          } > body.md

          if ! gh api "repos/$REPO/labels/$LABEL" > /dev/null 2>&1; then
            gh label create "$LABEL" --repo "$REPO" --color B60205 --force \
              --description "main の CI の失敗（自動で作る）"
          fi

          number=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --label "$LABEL" \
              --title "main の CI が失敗した" --body-file body.md
          else
            gh issue comment "$number" --repo "$REPO" --body-file body.md
          fi

      - name: 成功したので issue を閉じる
        if: steps.run.outputs.target == 'true' && steps.run.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ steps.run.outputs.url }}
          RUN_NUMBER: ${{ steps.run.outputs.run_number }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
        run: |
          set -euo pipefail
          key=$((RUN_NUMBER * 1000 + RUN_ATTEMPT))
          numbers=$(gh issue list --repo "$REPO" --label "$LABEL" --state open \
            --limit 100 --json number --jq '.[].number')
          for number in $numbers; do
            # CI の実行は重なりうるので、記録した最後の失敗より新しい成功（流し直しを含む）でだけ閉じる
            last_failure=$(gh issue view "$number" --repo "$REPO" --json body,comments \
              --jq '[.body, .comments[].body | scan("ci-run-key: ([0-9]+)") | .[0] | tonumber] | max // 0')
            if [ "$key" -gt "$last_failure" ]; then
              gh issue close "$number" --repo "$REPO" \
                --comment "main の CI が成功した: $RUN_URL"
            else
              echo "issue #$number の最後の失敗（$last_failure）より古い成功（$key）なので閉じない"
            fi
          done
